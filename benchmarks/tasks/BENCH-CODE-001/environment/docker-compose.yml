services:
  mysql:
    image: ${MYSQL_IMAGE:-mysql@sha256:0744ee5ef89ce6ccfa13de3e579fe6b9e27f93dd70da9c06d2c908b1b193fb8d}
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-bench-root-password}
      MYSQL_DATABASE: ${DB_NAME:-bench_code_001}
      MYSQL_USER: ${DB_USER:-bench_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-bench_password}
    ports:
      - "${DB_HOST_PORT:-3307}:3306"
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s
    tmpfs:
      - /var/lib/mysql
